[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphaevo"
version = "0.1.0"
description = "AlphaEvo — Open-Source RSI (Recursive Self-Improvement) Engine for Stock Research"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "ZhuLinsen"},
]
keywords = [
    "rsi",
    "recursive-self-improvement",
    "autoresearch",
    "alpha-evolution",
    "shadow-ledger",
    "stock",
    "trading",
    "strategy",
    "llm",
    "agent",
    "quant",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tenacity>=8.2",
    "typer>=0.9",
]

[project.optional-dependencies]
llm = ["litellm>=1.40"]
data-yfinance = ["yfinance>=0.2.0"]
data-akshare = ["akshare>=1.12.0"]
data-full = [
    "yfinance>=0.2.0",
    "akshare>=1.12.0",
    "efinance>=0.5.5",
    "tushare>=1.4.0",
    "baostock>=0.8.8",
]
dsa = []  # daily_stock_analysis integration (manually installed)
dev = [
    "build>=1.2",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "numpy<2.5",
    "pandas-stubs>=2.0",
    "types-PyYAML>=6.0",
    "pre-commit>=3.0",
]
tui = ["textual>=0.40"]
charts = ["plotext>=5.0", "matplotlib>=3.7"]
all = [
    "litellm>=1.40",
    "yfinance>=0.2.0",
    "akshare>=1.12.0",
    "efinance>=0.5.5",
    "tushare>=1.4.0",
    "baostock>=0.8.8",
    "build>=1.2",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "numpy<2.5",
    "pandas-stubs>=2.0",
    "types-PyYAML>=6.0",
    "pre-commit>=3.0",
    "textual>=0.40",
    "plotext>=5.0",
    "matplotlib>=3.7",
]

[project.scripts]
alphaevo = "alphaevo.cli.main:app"

[project.urls]
Homepage = "https://github.com/ZhuLinsen/alphaevo"
Documentation = "https://github.com/ZhuLinsen/alphaevo/tree/main/docs"
Repository = "https://github.com/ZhuLinsen/alphaevo"
Issues = "https://github.com/ZhuLinsen/alphaevo/issues"
Changelog = "https://github.com/ZhuLinsen/alphaevo/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/alphaevo"]

[tool.hatch.build.targets.wheel.force-include]
"strategies/builtin" = "alphaevo/_bundled/strategies/builtin"
"examples/showcase_data" = "alphaevo/_bundled/showcase_data"
"examples/rsi_stock_program.md" = "alphaevo/_bundled/rsi_stock_program.md"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["E501", "TC001", "TC003"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N806", "N817", "SIM108", "TC003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests requiring network access",
    "slow: slow tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yaml", "pandas", "yfinance", "akshare", "plotext", "litellm"]
ignore_missing_imports = true
